<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>登録申請 · 三倉建設株式会社</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#182c3a;background:#f2f5f8}header{background:#123a3b;color:white;padding:24px max(18px,calc((100% - 620px)/2))}h1{font-size:24px;margin:8px 0}main{max-width:660px;margin:24px auto;padding:0 18px}.card{background:white;padding:24px;border-radius:16px;border:1px solid #e1e8ec}label{display:block;font-size:14px;margin:18px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #bdcdd2;border-radius:8px;font:inherit;font-size:16px}textarea{min-height:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notice{padding:14px;background:#e9f5f0;border-radius:8px;line-height:1.7;font-size:14px}button{background:#19654c;color:white;border:0;border-radius:8px;padding:14px 20px;font:inherit;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}a{color:#19654c}.trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}footer{text-align:center;padding:20px;color:#657985;font-size:12px}@media(max-width:500px){.grid{grid-template-columns:1fr}.card{padding:18px}}</style></head>
<body><header><small>三倉建設株式会社</small><h1>機械・工具 登録申請</h1></header><main><section class="card"><p class="notice">ログイン不要で申請できます。<br>管理者の承認後に管理番号・QRコードが発行されます。<br>申請者名は公開ページには表示されません。</p>
<form id="registration"><label for="submitter">申請者名 *</label><input id="submitter" name="submitter" required maxlength="100" autocomplete="name"><label for="name">機械・工具名 *</label><input id="name" name="name" required maxlength="200"><label for="model">規格・型式</label><input id="model" name="model" maxlength="200"><div class="grid"><div><label for="unit">単位</label><select id="unit" name="unit"><option>台</option><option>個</option><option>本</option><option>式</option><option>セット</option><option>枚</option></select></div><div><label for="quantity">数量 *</label><input id="quantity" name="quantity" type="number" min="1" max="1000000" step="1" value="1" required></div></div><label for="date">購入日</label><input id="date" name="date" type="date"><label for="vehicleNo">積載車輌NO.</label><input id="vehicleNo" name="vehicleNo" maxlength="100"><label for="location">保管場所</label><input id="location" name="location" maxlength="200"><label for="note">備考</label><textarea id="note" name="note" maxlength="1000"></textarea><div class="trap" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div><button id="send" type="submit">申請を送信</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="./">機械・工具照会に戻る</a></p></section><footer>三倉建設株式会社 · <a href="tel:0339323225">03-3932-3225</a></footer></main>
<script>
const form=document.getElementById('registration');
const status=document.getElementById('status');
const send=document.getElementById('send');
let pendingPayload=null;
form.onsubmit=async event=>{
  event.preventDefault();
  const values=Object.fromEntries(new FormData(form));
  if(!values.submitter.trim() || !values.name.trim()){status.textContent='申請者名と機械・工具名を入力してください。';return;}
  if(!pendingPayload || Object.entries(values).some(([key,value])=>pendingPayload[key]!==value)) pendingPayload={...values,requestId:crypto.randomUUID()};
  send.disabled=true;status.textContent='申請を送信中です。そのままお待ちください。';
  try {
    const response=await fetch('https://mitsukura-tools-qr.huyhumg19.chatgpt.site/api/requests',{method:'POST',credentials:'omit',headers:{'content-type':'text/plain;charset=utf-8'},body:JSON.stringify(pendingPayload),signal:AbortSignal.timeout(35000)});
    const data=await response.json();
    if(!response.ok || !data.ok) throw Error(data.error||'送信できませんでした。');
    status.textContent='申請を受け付けました。管理者の承認をお待ちください。\n受付番号：'+data.requestId;
    form.reset();pendingPayload=null;send.textContent='別の機械・工具を申請する';
  } catch(error) {status.textContent=error.name==='TimeoutError' || error instanceof TypeError ? '送信結果を確認できませんでした。内容を変えずに再送信してください。' : error.message;}
  finally {send.disabled=false;}
};
</script></body></html>
