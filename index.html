<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>三倉建設株式会社 · 機械・工具照会</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#182c3a;font-family:system-ui,sans-serif}header{background:#123a3b;color:white;padding:23px max(20px,calc((100% - 620px)/2))}header small{color:#a9c8c4;letter-spacing:.08em}h1{font-size:22px;margin:8px 0}main{max-width:660px;margin:24px auto;padding:0 18px}.card{background:white;border:1px solid #e1e8ec;border-radius:16px;padding:24px}.contact{background:#fff8e8;border:1px solid #eddbac;border-radius:10px;padding:18px;margin-bottom:20px}.contact strong{font-size:20px}.contact p{font-size:14px;line-height:1.7}.contact a{font-size:22px;font-weight:700;padding:8px 0;display:inline-block}.contact small{display:block;color:#657985}.number{background:#e9f5f0;padding:14px 18px;border-radius:9px;color:#19654c}.number strong{font-size:25px;margin-left:12px}dl>div{padding:15px 0;border-bottom:1px solid #edf0f2}dt{font-size:12px;color:#657985}dd{margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}form{display:flex;gap:8px;margin-top:20px}input{min-width:0;flex:1;border:1px solid #c8d4da;border-radius:8px;padding:12px;font-size:16px}button{background:#19654c;border:0;border-radius:8px;color:white;padding:12px 18px;font-size:15px}footer{text-align:center;color:#73858d;font-size:12px;padding:20px}a{color:#19654c}
</style>
</head>
<body>
<header><small>三倉建設株式会社</small><h1>機械・工具 詳細情報</h1></header>
<main><section class="card">
<p><a href="register.html">＋ 機械・工具の登録申請（ログイン不要）</a></p>
<aside class="contact" aria-label="拾得時の連絡先"><strong>三倉建設株式会社</strong><p>この機械・工具は当社の所有物です。<br>お拾いになった方は、下記までご連絡ください。</p><a href="tel:0339323225">03-3932-3225</a><small>タップして電話する</small></aside>
<div id="result" aria-live="polite">管理番号を入力してください。</div>
<p><a id="editRequest" href="register.html">この機械・工具を登録・変更申請する</a></p>
<form method="get"><input id="number" name="id" aria-label="管理番号" placeholder="管理番号" inputmode="numeric" pattern="[1-9][0-9]{0,14}" required><button>照会</button></form>
</section><footer>閲覧専用 · ログイン不要<br>情報の変更は管理者へお問い合わせください。</footer></main>
<script>
const fields = [['name','機械・工具名'],['model','規格・型式'],['unit','単位'],['quantity','数量'],['date','購入日'],['disposalDate','廃棄日'],['disposalReason','廃棄理由'],['vehicleNo','積載車輌NO.'],['location','保管場所'],['note','備考'],['updatedAt','最終更新日時']];
const result = document.getElementById('result');
const id = (new URLSearchParams(location.search).get('id') || '').trim();
document.getElementById('number').value = id;
const editLink=document.getElementById('editRequest');
editLink.href='register.html'+(id?'?id='+encodeURIComponent(id):'');
async function load() {
  if (!id) return;
  if (!/^[1-9]\d{0,14}$/.test(id)) {result.textContent='管理番号を確認してください。';return;}
  result.textContent='データを読み込み中...';
  try {
    const response = await fetch('https://mitsukura-tools-qr.huyhumg19.chatgpt.site/api/item?id='+encodeURIComponent(id), {credentials:'omit', signal:AbortSignal.timeout(25000)});
    const data = await response.json();
    if (!response.ok || !data.item) {
      if(response.status===404) {result.textContent='管理番号 '+id+' は未登録です。下のリンクから情報を申請してください。';editLink.textContent='このQR番号で登録申請する';return;}
      throw new Error(data.error || 'データを取得できませんでした。');
    }
    const number = document.createElement('div');number.className='number';number.textContent='管理番号 ';
    const strong = document.createElement('strong');strong.textContent=id;number.append(strong);
    const list = document.createElement('dl');
    for (const [key,label] of fields) {
      const row=document.createElement('div');const title=document.createElement('dt');const value=document.createElement('dd');
      title.textContent=label;value.textContent=data.item[key] || '—';row.append(title,value);list.append(row);
    }
    result.replaceChildren(number,list);
    if(data.item.photoUrl && /^https:\/\/mitsukura-tools-qr\.huyhumg19\.chatgpt\.site\/photos\/[a-f0-9-]{36}\/[a-f0-9]{64}\.jpg$/.test(data.item.photoUrl)) {
      const photo=document.createElement('img');photo.src=data.item.photoUrl;photo.alt=data.item.name||'機械・工具の写真';photo.style.cssText='display:block;width:100%;max-height:420px;object-fit:contain;margin:16px 0;border-radius:10px';photo.decoding='async';number.after(photo);
    }
    document.title='NO. '+id+' · 三倉建設株式会社';
  } catch(error) {result.textContent=error.name==='TimeoutError' || error instanceof TypeError ? 'データを取得できませんでした。再読み込みしてください。' : error.message;}
}
load();
</script>
</body></html>
